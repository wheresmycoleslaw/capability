name: Capability Forge Live Proof

on:
  push:
    branches: [forge-v0.8]
    paths:
      - .github/workflows/forge-live-test.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - run: docker pull node:24-alpine
      - name: Turn an unchanged GitHub function into an ability and execute it
        run: |
          node --input-type=module <<'NODE' > /tmp/forge.json
          import { readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { activateForgedAbility, forgeGitHubAbility } from './dist/forge.js';

          const forged = await forgeGitHubAbility('sindresorhus/slugify', {
            query: 'slugify text',
            symbol: 'slugify',
            directory: '/tmp/forged-slugify'
          });
          const packagePath = join(forged.project.directory, 'package.json');
          const pkg = JSON.parse(await readFile(packagePath, 'utf8'));
          pkg.dependencies['@wheresmycoleslaw/capability'] = 'file:/tmp/wheresmycoleslaw-capability-0.8.0.tgz';
          await writeFile(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          const receipt = await activateForgedAbility(forged, { args: ['Hello Capability World'] }, { approved: true });
          console.log(JSON.stringify({ ...forged, receipt }, null, 2));
          NODE
          cat /tmp/forge.json
          grep -q '"sourceBinding": "verified-git-head"' /tmp/forge.json
          grep -q '"kind": "npm-export"' /tmp/forge.json
          grep -q 'hello-capability-world' /tmp/forge.json
          grep -q '"status": "succeeded"' /tmp/forge.json
