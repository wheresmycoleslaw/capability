name: Finalize Capability 0.9 Runtime Retry 3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/metabolism-v090-finalize-retry3.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply finalization, tests, and robust CLI handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/metabolism-v090-finalize.yml').read_text()
          body=text.split("          python - <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          lines=body.splitlines()
          Path('/tmp/finalize.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n')
          for file in ['test/adoption.test.mjs','test/forge.test.mjs']:
              p=Path(file); p.write_text(p.read_text().replace('^0.8.1','^0.9.0'))
          p=Path('test/discovery.test.mjs'); s=p.read_text()
          marker='''    "capability_solve",\n    "capability_inspect",'''
          if '"capability_metabolize"' not in s:
              s=s.replace(marker,'''    "capability_solve",\n    "capability_metabolize",\n    "capability_compose",\n    "capability_coverage",\n    "capability_inspect",''')
          p.write_text(s)
          PY
          python /tmp/finalize.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/cli.ts'); s=p.read_text()
          metab='import { createCapabilityGap, executeOciImage, executePyPiAbility, forgePyPiAbility, inspectOciImage, inspectPyPiPackage, metabolizeIntent, metabolicCoverage, minePyPiArtifact, planComposition } from "./metabolism.js";\n'
          extra='import { composeIntent } from "./metabolic-compose.js";\nimport { scaffoldCapabilityGapProject } from "./gap-scaffold.js";\nimport type { CapabilityGap } from "./metabolism.js";\n'
          if 'from "./metabolic-compose.js"' not in s:
              s=s.replace(metab,metab+extra)
          old='''if (command === "gap") {\n  const effects = takeOptions(args, "--effect") as CapabilityEffect[];\n  const intent = args.join(" ").trim();\n  if (!intent) usage();\n  console.log(JSON.stringify(createCapabilityGap(intent, { effectsCeiling: effects }), null, 2));\n  return;\n}\n'''
          new='''if (command === "gap") {\n  const effects = takeOptions(args, "--effect") as CapabilityEffect[];\n  const out = takeOption(args, "--out");\n  const intent = args.join(" ").trim();\n  if (!intent) usage();\n  const gap = createCapabilityGap(intent, { effectsCeiling: effects });\n  if (out) await writeFile(resolve(out), `${JSON.stringify(gap, null, 2)}\\n`, "utf8");\n  console.log(JSON.stringify(gap, null, 2));\n  return;\n}\n'''
          if old in s: s=s.replace(old,new)
          anchor='  if (command === "coverage") {'
          insert='''  if (command === "compose-intent") {\n    const inputRaw = takeOption(args, "--input");\n    const approved = takeFlag(args, "--approve");\n    const indexes = liveIndexes(args);\n    const intent = args.join(" ").trim();\n    if (!intent) usage();\n    const result = await composeIntent(intent, { indexes, ...(inputRaw !== undefined ? { input: parseJson(inputRaw) } : {}), approved });\n    console.log(JSON.stringify(result, null, 2));\n    process.exitCode = result.route === "gap" ? 2 : 0;\n    return;\n  }\n\n  if (command === "build-gap") {\n    const packageName = takeOption(args, "--name");\n    const capabilityId = takeOption(args, "--id");\n    const repository = takeOption(args, "--repo");\n    const force = takeFlag(args, "--force");\n    const gapPath = args.shift() ?? usage();\n    const directory = args.shift() ?? usage();\n    if (args.length) usage();\n    const gap = JSON.parse(await readFile(resolve(gapPath), "utf8")) as CapabilityGap;\n    console.log(JSON.stringify(await scaffoldCapabilityGapProject(gap, { directory, packageName, capabilityId, repository, force }), null, 2));\n    return;\n  }\n\n'''
          if 'if (command === "compose-intent")' not in s:
              s=s.replace(anchor,insert+anchor)
          if 'cap gap <intent> [--effect <effect>...] [--out <path>]' not in s:
              s=s.replace('cap gap <intent> [--effect <effect>...]','cap gap <intent> [--effect <effect>...] [--out <path>]')
          p.write_text(s)
          PY
          npm install --ignore-scripts
          npm run registry
          npm test
      - name: Prove PyPI exact-wheel metabolism
        run: |
          set -euxo pipefail
          node dist/cli.js coverage > /tmp/coverage.json
          grep -q '"substrate": "pypi"' /tmp/coverage.json
          node dist/cli.js pypi-mine inflection --query 'camelize text' > /tmp/pypi-mine.json
          grep -q '"symbol": "camelize"' /tmp/pypi-mine.json
          node dist/cli.js pypi-forge inflection --query 'camelize text' --symbol camelize --execute '{"args":["hello_world"]}' --approve > /tmp/pypi-run.json
          grep -q '"artifactVerified": true' /tmp/pypi-run.json
          grep -q '"network": "none"' /tmp/pypi-run.json
          grep -q '"dependencyPolicy": "no-deps"' /tmp/pypi-run.json
          grep -q 'HelloWorld' /tmp/pypi-run.json
      - name: Prove immutable OCI metabolism
        run: |
          set -euxo pipefail
          node dist/cli.js oci-inspect busybox:1.36 > /tmp/oci-inspect.json
          grep -q '@sha256:' /tmp/oci-inspect.json
          node dist/cli.js oci-run busybox:1.36 echo capability-oci-ok --approve > /tmp/oci-run.json
          grep -q '"status": "succeeded"' /tmp/oci-run.json
          grep -q 'capability-oci-ok' /tmp/oci-run.json
      - name: Prove runtime capability composition
        run: |
          set -euxo pipefail
          node dist/cli.js compose-intent 'normalize text then slugify text' > /tmp/compose.json
          grep -q '"route": "composition"' /tmp/compose.json
          grep -q 'text/normalize' /tmp/compose.json
          grep -q 'text/slugify' /tmp/compose.json
      - name: Prove unresolved gap to buildable project loop
        run: |
          set -euxo pipefail
          node dist/cli.js gap 'perform a deliberately unresolved proof operation' --out /tmp/gap.json > /tmp/gap-stdout.json
          grep -q '"status": "unresolved"' /tmp/gap.json
          node dist/cli.js build-gap /tmp/gap.json /tmp/gap-project --force > /tmp/gap-project.json
          test -f /tmp/gap-project/capability-gap.json
          grep -q 'capability-gap.json' /tmp/gap-project/package.json
      - name: Commit finalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src package.json package-lock.json registry/index.json README.md METABOLISM.md BINDERS.md capability-gap.schema.json test
          git commit -m 'Capability 0.9: complete metabolic binder, composition, and gap loop'
          git push origin HEAD:main
