name: Materialize Capability Forge 0.8

on:
  push:
    branches: [forge-v0.8]
    paths:
      - .github/workflows/forge-v080-commit.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge-v0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply integration script from prepare workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/forge-v080-prepare.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          if marker not in source:
              raise SystemExit('prepare script marker missing')
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__main__'})
          PY
      - name: Refresh generated metadata
        run: |
          npm install --ignore-scripts
          npm run build
          npm run registry
      - name: Commit integration before validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . \
            ':!.github/workflows/forge-v080-prepare.yml' \
            ':!.github/workflows/forge-v080-commit.yml' \
            ':!.github/workflows/ecosystem-smoke.yml'
          git commit -m "Integrate Capability Forge 0.8"
          git push origin HEAD:forge-v0.8
