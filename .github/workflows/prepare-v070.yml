name: Prepare Capability 0.7.0 Repository Mining

on:
  push:
    branches: [repository-mining-v0.7]
    paths:
      - .github/workflows/prepare-v070.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repository-mining-v0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate repository mining surfaces
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          pkg.version = '0.7.0';
          pkg.description = 'An open standard and runtime for agents to discover native abilities and existing software, mine arbitrary repositories for evidence-backed abilities, bridge tools, inspect authority, verify artifacts, and execute with receipts.';
          pkg.exports['./repository-mine'] = { types: './dist/repository-mine.d.ts', import: './dist/repository-mine.js' };
          if (!pkg.files.includes('REPOSITORY_MINING.md')) pkg.files.push('REPOSITORY_MINING.md');
          for (const keyword of ['repository-mining', 'source-analysis', 'capability-mining', 'code-intelligence']) if (!pkg.keywords.includes(keyword)) pkg.keywords.push(keyword);
          await writeFile('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let external = await readFile('src/external-discovery.ts', 'utf8');
          external = external.replace(
            'export type ExternalAdoptionMethod = "native-capability" | "npm-cli" | "mcp" | "openapi" | "manual-adapter";',
            'export type ExternalAdoptionMethod = "native-capability" | "npm-cli" | "mcp" | "openapi" | "repository-mine" | "manual-adapter";'
          );
          external = external.replace(
            'const adoption: ExternalAdoptionHint[] = [hint("manual-adapter", "high", "Repository code can remain upstream; Capability only needs a sidecar around a stable operation or executable surface.")];',
            'const adoption: ExternalAdoptionHint[] = [hint("repository-mine", "high", "Capability can inspect the exact repository commit for exported/public abilities, evidence, confidence, and inferred authority without executing repository code."), hint("manual-adapter", "high", "Repository code can remain upstream; Capability only needs a sidecar around a stable operation or executable surface.")];'
          );
          await writeFile('src/external-discovery.ts', external);

          let cli = await readFile('src/cli.ts', 'utf8');
          cli = cli.replace(
            'import { connectStdioMcpCapabilities } from "./mcp-import.js";\n',
            'import { connectStdioMcpCapabilities } from "./mcp-import.js";\nimport { mineGitHubRepository } from "./repository-mine.js";\n'
          );
          cli = cli.replace(
            'Discovery and interoperability:\n  cap world <query> [--index <url>] [--limit <n>] [--no-npm] [--no-github]\n',
            'Discovery and interoperability:\n  cap world <query> [--index <url>] [--limit <n>] [--no-npm] [--no-github]\n  cap mine github <owner/repo|url> [--ref <git-ref>] [--query <text>] [--limit <n>] [--max-files <n>] [--max-file-bytes <n>] [--out <path>]\n'
          );
          const worldMarker = '  if (command === "world") {\n';
          if (!cli.includes(worldMarker)) throw new Error('CLI world marker missing');
          const mineBlock = `  if (command === "mine") {\n    const mineKind = args.shift() ?? usage();\n    if (mineKind !== "github") throw new TypeError(\`Unknown mine kind: \${mineKind}. Currently supported: github\`);\n    const ref = takeOption(args, "--ref");\n    const query = takeOption(args, "--query");\n    const limitRaw = takeOption(args, "--limit");\n    const maxFilesRaw = takeOption(args, "--max-files");\n    const maxFileBytesRaw = takeOption(args, "--max-file-bytes");\n    const output = takeOption(args, "--out");\n    const repository = args.shift() ?? usage();\n    if (args.length) usage();\n    const report = await mineGitHubRepository(repository, {\n      ref,\n      query,\n      ...(limitRaw ? { maxCandidates: Number.parseInt(limitRaw, 10) } : {}),\n      ...(maxFilesRaw ? { maxFiles: Number.parseInt(maxFilesRaw, 10) } : {}),\n      ...(maxFileBytesRaw ? { maxFileBytes: Number.parseInt(maxFileBytesRaw, 10) } : {})\n    });\n    const rendered = JSON.stringify(report, null, 2);\n    if (output) {\n      await writeFile(resolve(output), rendered + "\\n", "utf8");\n      console.log(JSON.stringify({ output: resolve(output), repository: report.repository.fullName, commit: report.repository.commit, candidates: report.candidates.length, coverage: report.coverage }, null, 2));\n    } else console.log(rendered);\n    return;\n  }\n\n`;
          cli = cli.replace(worldMarker, mineBlock + worldMarker);
          await writeFile('src/cli.ts', cli);

          let network = await readFile('src/network-mcp.ts', 'utf8');
          network = network.replace(
            'import { probeCapabilitySite } from "./web-discovery.js";\n',
            'import { probeCapabilitySite } from "./web-discovery.js";\nimport { mineGitHubRepository } from "./repository-mine.js";\n'
          );
          const inspectToolMarker = `  {\n    name: "capability_inspect",`;
          if (!network.includes(inspectToolMarker)) throw new Error('MCP inspect tool marker missing');
          const mineTool = `  {\n    name: "capability_mine_repository",\n    title: "Mine GitHub Repository Abilities",\n    description: "Inspect an arbitrary GitHub repository at an exact commit and infer useful public abilities from manifests, docs, tests, examples, source declarations, routes, and authority signals without executing repository code. Inferences remain non-executable candidates.",\n    inputSchema: {\n      type: "object",\n      properties: {\n        repository: { type: "string", description: "owner/repo or a GitHub repository URL" },\n        ref: { type: "string" },\n        query: { type: "string" },\n        limit: { type: "integer", minimum: 1, maximum: 500 },\n        maxFiles: { type: "integer", minimum: 8, maximum: 500 }\n      },\n      required: ["repository"]\n    },\n    annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: true }\n  },\n`;
          network = network.replace(inspectToolMarker, mineTool + inspectToolMarker);
          const inspectCallMarker = '      if (name === "capability_inspect") {\n';
          if (!network.includes(inspectCallMarker)) throw new Error('MCP inspect call marker missing');
          const mineCall = `      if (name === "capability_mine_repository") {\n        if (typeof args.repository !== "string" || !args.repository) throw new TypeError("repository is required");\n        return textResult(await mineGitHubRepository(args.repository, {\n          ref: typeof args.ref === "string" ? args.ref : undefined,\n          query: typeof args.query === "string" ? args.query : undefined,\n          maxCandidates: typeof args.limit === "number" ? Math.max(1, Math.min(500, Math.trunc(args.limit))) : 100,\n          maxFiles: typeof args.maxFiles === "number" ? Math.max(8, Math.min(500, Math.trunc(args.maxFiles))) : 120\n        }));\n      }\n`;
          network = network.replace(inspectCallMarker, mineCall + inspectCallMarker);
          await writeFile('src/network-mcp.ts', network);

          let server = await readFile('src/mcp-server.ts', 'utf8');
          server = server.replace('const SERVER_INFO = { name: "capability-network", version: "0.6.0" };', 'const SERVER_INFO = { name: "capability-network", version: "0.7.0" };');
          server = server.replace(
            'Use capability_search for executable Capability-native abilities, capability_search_world when you need to discover existing external software, capability_inspect before execution, and capability_execute only after reviewing declared effects and required approval.',
            'Use capability_search for executable Capability-native abilities, capability_search_world to discover existing external software, capability_mine_repository to inspect a selected GitHub repository without executing it, capability_inspect before execution, and capability_execute only after reviewing declared effects and required approval.'
          );
          server = server.replace(
            'Capability is a bootstrap MCP server: search the federated ability network or external software catalogs, inspect contracts before code loading, bridge existing tools without rewriting them, and execute Capability-native artifacts through verified isolated acquisition.',
            'Capability is a bootstrap MCP server: search the federated ability network or external software catalogs, mine arbitrary GitHub repositories into evidence-backed non-executable ability candidates, inspect contracts before code loading, bridge existing tools without rewriting them, and execute Capability-native artifacts through verified isolated acquisition.'
          );
          await writeFile('src/mcp-server.ts', server);

          let readme = await readFile('README.md', 'utf8');
          const createMarker = '## Create a capability\n';
          if (!readme.includes(createMarker)) throw new Error('README create marker missing');
          const miningSection = `## Mine an arbitrary GitHub repository\n\nCapability can move beyond repository-level search and inspect the contents of an ordinary project that has never adopted Capability:\n\n\`\`\`bash\ncap mine github owner/repo\ncap mine github owner/repo --query "render video"\n\`\`\`\n\nThe miner resolves an exact commit, reads bounded repository evidence, identifies public/exported functions, CLI surfaces and HTTP operations, correlates docs/tests/examples, infers visible authority signals, and emits non-executable draft contracts with explicit confidence and coverage. It does **not** execute the repository and it never treats missing effect evidence as proof that an effect is absent.\n\nThis turns GitHub from a directory of projects into a latent ability corpus while preserving the line between **discovery** and **trust**. See [REPOSITORY_MINING.md](./REPOSITORY_MINING.md).\n\n`;
          readme = readme.replace(createMarker, miningSection + createMarker);
          await writeFile('README.md', readme);

          let universal = await readFile('UNIVERSAL.md', 'utf8');
          if (!universal.includes('## Repository mining')) universal += `\n## Repository mining\n\n\`cap mine github owner/repo\` analyzes an exact repository commit and emits evidence-backed, non-executable candidate abilities. It correlates public source declarations with manifests, documentation, tests, examples, routes, and local effect signals. Repository mining never upgrades an inference into trusted executable code; promotion still requires a concrete adapter/native contract, exact artifact binding, authority review, policy, and isolation.\n`;
          await writeFile('UNIVERSAL.md', universal);

          let changelog = await readFile('CHANGELOG.md', 'utf8');
          if (!changelog.includes('## 0.7.0')) {
            changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n## 0.7.0\n\n- mine arbitrary GitHub repositories at exact commits into evidence-backed, non-executable ability candidates\n- correlate public source declarations with manifests, docs, tests, examples, routes, confidence and source coverage\n- infer visible authority signals while explicitly preserving incomplete/unknown effects\n- add `cap mine github` and MCP `capability_mine_repository`\n- expose `@wheresmycoleslaw/capability/repository-mine` and repository-mining documentation\n\n');
          }
          await writeFile('CHANGELOG.md', changelog);

          let smoke = await readFile('.github/workflows/ecosystem-smoke.yml', 'utf8');
          const smokeMarker = '      - name: Inspect an existing npm package without installing it\n';
          if (!smoke.includes(smokeMarker)) throw new Error('Smoke marker missing');
          const smokeStep = `      - name: Mine an unchanged external GitHub repository\n        run: |\n          cap mine github sindresorhus/slugify --query slug --max-files 30 --limit 20 > /tmp/repo-mine.json\n          grep -q '"fullName": "sindresorhus/slugify"' /tmp/repo-mine.json\n          grep -q '"executable": false' /tmp/repo-mine.json\n          grep -q '"complete": false' /tmp/repo-mine.json\n          grep -qi 'slug' /tmp/repo-mine.json\n`;
          smoke = smoke.replace(smokeMarker, smokeStep + smokeMarker);
          smoke = smoke.replace("          grep -q 'capability_search_world' /tmp/mcp.jsonl\n", "          grep -q 'capability_search_world' /tmp/mcp.jsonl\n          grep -q 'capability_mine_repository' /tmp/mcp.jsonl\n");
          await writeFile('.github/workflows/ecosystem-smoke.yml', smoke);
          NODE
          node scripts/generate-registry.mjs --write
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run registry:validate
      - name: Verify CLI repository mining against fixture tests
        run: node --test test/repository-mine.test.mjs
      - name: Commit integrated 0.7.0 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/ecosystem-smoke.yml
          git add package.json src/external-discovery.ts src/cli.ts src/network-mcp.ts src/mcp-server.ts README.md UNIVERSAL.md CHANGELOG.md registry/index.json
          git commit -m "Integrate repository mining for Capability 0.7.0"
          git push origin HEAD:repository-mining-v0.7
