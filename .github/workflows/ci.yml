name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run

  node20-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run registry:check
      - run: npm run conformance
      - run: npm pack --dry-run

  compatibility-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Prove clean-room binder extension against public 1.x boundary
        run: |
          node --input-type=module <<'NODE'
          import {
            METABOLIC_BINDING_VERSION,
            MetabolicBinderRegistry,
            runBinderConformance,
            runProtocolConformance
          } from './dist/index.js';

          const protocol = await runProtocolConformance();
          if (!protocol.ok) throw new Error(JSON.stringify(protocol));

          const binder = {
            id: 'clean-room/digest-command',
            substrate: 'clean-room',
            discovery: 'explicit',
            description: 'CI-owned third-party-style binder with no Capability core special case.',
            async bind({ locator }) {
              return {
                bindingVersion: METABOLIC_BINDING_VERSION,
                binderId: this.id,
                substrate: this.substrate,
                locator,
                immutableArtifact: 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
                createdAt: new Date().toISOString(),
                authority: { complete: false, effects: ['custom:external.opaque-effects'] },
                evidence: ['sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb']
              };
            },
            async execute(_binding, input) {
              return { status: 'succeeded', output: input, isolation: 'clean-room-ci' };
            }
          };

          const report = await runBinderConformance(binder, { locator: 'clean-room:latest' }, { executeInput: { ok: true }, approved: true });
          if (!report.ok) throw new Error(JSON.stringify(report));

          const registry = new MetabolicBinderRegistry().register(binder);
          const binding = await registry.bind(binder.id, { locator: 'clean-room:latest' });
          let refused = false;
          try { await registry.execute(binder.id, binding, {}); } catch { refused = true; }
          if (!refused) throw new Error('incomplete authority bypassed approval');
          const execution = await registry.execute(binder.id, binding, { ok: true }, { approved: true });
          if (execution.receipt.immutableArtifact !== binding.immutableArtifact) throw new Error('receipt lost artifact identity');
          NODE

  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --ignore-scripts
      - run: npm run registry:validate

  npm-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm install --global npm@11
      - name: Verify a previously provenance-published package
        run: |
          node --input-type=module <<'NODE'
          import { VerifiedNpmPackageInstaller } from './dist/index.js';
          const installed = await new VerifiedNpmPackageInstaller().install('@wheresmycoleslaw/capability', '0.2.0');
          if (!installed.verification?.registrySignatureVerified) throw new Error('registry signature was not verified');
          if (!installed.verification?.provenanceVerified) throw new Error('npm provenance was not verified');
          console.log(JSON.stringify(installed.verification));
          NODE

  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: docker pull node:24-alpine
      - run: node --test test/docker.test.mjs
        env:
          CAPABILITY_DOCKER_TEST: "1"

  prepare-release-1-1-1:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/1.1.1-resolution-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.1-resolution-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare release metadata
        run: |
          npm version 1.1.1 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.description = 'An ability-resolution and governed execution layer for AI agents: use prepared providers first, then resolve abilities from the broader software world.';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          printf '1.1.1\n' > .release
          npm run registry
          python3 <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text()
          if '## 1.1.1\n' not in text:
              h = '# Changelog\n\n'
              entry = '''## 1.1.1

- fix `need()` so discovery-only requests resolve across prepared providers, the Capability index, npm, and GitHub without requiring Forge/materialization to succeed first
- turn natural-language outcomes into bounded focused software searches and rank direct utilities ahead of framework/plugin near-misses
- expose the runtime's pure built-in abilities as a first-class prepared provider for cloud and serverless consumers
- make execution continue past discovery-only providers rather than returning a misleading ready result
- preserve external software as explicitly non-execution-ready and authority-incomplete until it is acquired/materialized in an appropriate execution environment
- add deterministic and live-network regression coverage across unrelated software needs

'''
              assert text.startswith(h)
              p.write_text(h + entry + text[len(h):])
          PY
      - name: Verify release candidate
        run: |
          npm install --ignore-scripts
          npm test
          npm run conformance
          npm run registry:validate
          npm pack --dry-run
      - name: Commit verified release metadata
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json registry/index.json .release CHANGELOG.md .github/workflows/ci.yml .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git commit -m "Release Capability 1.1.1"
          git push origin HEAD:release/1.1.1-resolution-fix
