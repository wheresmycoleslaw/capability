name: Sync Capability 1.1.0 registry

on:
  push:
    branches:
      - release/1.1.0-ability-first
    paths:
      - .github/workflows/sync-registry-1-1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0-ability-first
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run registry
      - name: Commit generated registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry/index.json
          git commit -m 'Regenerate public registry for 1.1.0'
          git push origin HEAD:release/1.1.0-ability-first
