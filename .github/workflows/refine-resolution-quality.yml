name: Refine resolver quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-whole-software-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refine generic query planning and ranking
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/external-discovery.ts')
          text = path.read_text()
          start = text.index('const EXTERNAL_QUERY_STOPWORDS = new Set([')
          end = text.index('\n\nexport async function discoverExternalSoftware', start)
          replacement = r'''const EXTERNAL_QUERY_STOPWORDS = new Set([
  "a", "an", "the", "to", "of", "for", "in", "on", "at", "by", "with", "and", "or", "from", "into",
  "this", "that", "my", "your", "its", "please", "use", "using", "find", "need", "needs", "ability", "abilities",
  "tool", "tools", "something", "way", "can", "could", "would", "should"
]);

// Words that usually describe the operation or data envelope rather than the software subject.
// Keeping this generic prevents one-off aliases while letting requests such as "parse a CSV string"
// produce focused searches for "csv" and "extract text from a PDF" produce "pdf".
const EXTERNAL_GENERIC_TERMS = new Set([
  "convert", "transform", "parse", "extract", "generate", "create", "make", "build", "format", "normalize",
  "read", "write", "load", "save", "handle", "process", "text", "string", "strings", "file", "files", "document",
  "documents", "record", "records", "value", "values", "input", "output", "content"
]);

const INDIRECT_PACKAGE_TERMS = new Set([
  "plugin", "adapter", "middleware", "loader", "contrib", "eslint", "babel", "webpack", "gulp", "grunt", "koa",
  "express", "react", "vue", "angular", "node-red"
]);

function discoveryTokens(value: string): string[] {
  return value.toLowerCase().split(/[^a-z0-9]+/g).filter((token) => token.length > 1 && !EXTERNAL_QUERY_STOPWORDS.has(token));
}

function subjectTokens(value: string): string[] {
  const content = discoveryTokens(value);
  const focused = content.filter((token) => !EXTERNAL_GENERIC_TERMS.has(token));
  return focused.length ? focused : content;
}

function normalizedKey(value: string): string {
  return value.toLowerCase().replace(/[^a-z0-9]+/g, "");
}

/** Build bounded focused search expressions from a natural-language outcome. */
export function planExternalSearchQueries(query: string, maxQueries = 8): string[] {
  const raw = query.trim().replace(/\s+/g, " ");
  if (!raw) return [];
  const content = discoveryTokens(raw);
  const subject = subjectTokens(raw);
  const variants: string[] = [];
  const add = (value: string) => { if (value.trim()) variants.push(value.trim()); };

  // Subject-first variants are the highest-signal searches.
  add(subject.join(" "));
  if (subject.length > 1) {
    add(subject.join(""));
    add(subject.join("-"));
  }
  for (let size = Math.min(3, subject.length); size >= 2; size--) {
    for (let i = 0; i <= subject.length - size; i++) {
      const slice = subject.slice(i, i + size);
      add(slice.join(" "));
      add(slice.join(""));
    }
  }
  if (subject.length === 1) add(subject[0]!);

  // Preserve operation context as lower-priority fallbacks.
  add(content.join(" "));
  add(raw);

  const seen = new Set<string>();
  const planned: string[] = [];
  for (const variant of variants) {
    const normalized = variant.trim().replace(/\s+/g, " ");
    if (normalized.length < 2) continue;
    const key = normalized.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    planned.push(normalized);
    if (planned.length >= Math.max(1, maxQueries)) break;
  }
  return planned;
}

function relevanceScore(intent: string, candidate: ExternalSoftwareCandidate, queryIndex: number, queryCount: number): number {
  const subject = subjectTokens(intent);
  const allIntentTokens = discoveryTokens(intent);
  const name = candidate.name.toLowerCase();
  const description = candidate.description.toLowerCase();
  const nameKey = normalizedKey(candidate.name);
  const subjectKey = normalizedKey(subject.join(" "));

  const subjectInName = subject.filter((token) => name.includes(token)).length;
  const subjectInDescription = subject.filter((token) => description.includes(token)).length;
  const intentInDescription = allIntentTokens.filter((token) => description.includes(token)).length;
  const nameCoverage = subject.length ? subjectInName / subject.length : 0;
  const descriptionCoverage = subject.length ? subjectInDescription / subject.length : 0;
  const intentCoverage = allIntentTokens.length ? intentInDescription / allIntentTokens.length : 0;

  let nameAffinity = nameCoverage;
  if (subjectKey && nameKey === subjectKey) nameAffinity = 1;
  else if (subjectKey && (nameKey.includes(subjectKey) || subjectKey.includes(nameKey))) nameAffinity = Math.max(nameAffinity, 0.82);

  const rank = 1 / Math.max(1, candidate.sourceRank);
  const popularity = candidate.popularity && candidate.popularity > 0 ? Math.min(1, Math.log10(candidate.popularity + 1) / 5) : 0;
  const focusWeight = queryCount > 1 ? 1 - (queryIndex / (queryCount - 1)) * 0.08 : 1;

  const intentMentionsIndirect = allIntentTokens.some((token) => INDIRECT_PACKAGE_TERMS.has(token));
  const candidateTokens = new Set(candidate.name.toLowerCase().split(/[^a-z0-9]+/g).filter(Boolean));
  const indirect = !intentMentionsIndirect && [...candidateTokens].some((token) => INDIRECT_PACKAGE_TERMS.has(token));
  const indirectPenalty = indirect ? 0.22 : 0;

  const score = (
    nameAffinity * 0.34 +
    descriptionCoverage * 0.24 +
    intentCoverage * 0.14 +
    rank * 0.20 +
    popularity * 0.08
  ) * focusWeight - indirectPenalty;
  return Math.max(0, Math.min(1, score));
}'''
          path.write_text(text[:start] + replacement + text[end:])

          # Cap repeated-query bonus so repetition helps confidence without overwhelming directness.
          text = path.read_text()
          old = 'score: Math.max(previous.score, scored) + Math.min(0.18, hits * 0.03),'
          if old not in text:
              raise SystemExit('repeat-hit score marker missing')
          path.write_text(text.replace(old, 'score: Math.min(1, Math.max(previous.score, scored) + Math.min(0.12, (hits - 1) * 0.025)),', 1))

          # Surface a ranked shortlist in the resolution result instead of hiding all runner-up evidence.
          path = Path('src/need.ts')
          text = path.read_text()
          old = '''          result: {
            stage: "discovered",
            executionReady: false,
            candidate,
            errors: discovery.errors
          },'''
          new = '''          result: {
            stage: "discovered",
            executionReady: false,
            candidate,
            alternatives: discovery.external.slice(1, 6).map(externalAbilityCandidate),
            errors: discovery.errors
          },'''
          if old not in text:
              raise SystemExit('need result marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install and verify
        run: |
          npm install --ignore-scripts
          npm test
          npm pack --dry-run
      - name: Live quality gate across unrelated outcomes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { need } from './dist/need.js';

          const checks = [
            ['convert separated text to camel case', /camel/i, /plugin|jss/i],
            ['parse a CSV string into records', /csv/i, /node-red|contrib/i],
            ['extract text from a PDF', /pdf/i, /node-red|contrib/i],
            ['generate a UUID', /uuid/i, /node-red|contrib/i],
            ['convert Markdown to HTML', /markdown|marked|showdown/i, /koa|plugin/i]
          ];
          const resolutions = await Promise.all(checks.map(([intent]) => need(intent)));
          for (let i = 0; i < checks.length; i++) {
            const [intent, expected, reject] = checks[i];
            const resolution = resolutions[i];
            assert.equal(resolution.status, 'ready', `${intent}: ${resolution.status}`);
            assert.ok(resolution.candidate, `${intent}: missing candidate`);
            const identity = `${resolution.candidate.id} ${resolution.candidate.name ?? ''} ${resolution.candidate.description ?? ''}`;
            assert.match(identity, expected, `${intent}: candidate lacks the core subject: ${identity}`);
            assert.doesNotMatch(resolution.candidate.id, reject, `${intent}: indirect framework/plugin won ranking: ${resolution.candidate.id}`);
            console.log(JSON.stringify({ intent, source: resolution.source, candidate: resolution.candidate.id, score: resolution.candidate.score, alternatives: resolution.result?.alternatives?.slice(0, 3).map((entry) => entry.id) }));
          }
          NODE
      - name: Commit verified quality refinement and remove temporary gate
        run: |
          rm .github/workflows/refine-resolution-quality.yml .github/workflows/live-resolution-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/external-discovery.ts src/need.ts .github/workflows/refine-resolution-quality.yml .github/workflows/live-resolution-smoke.yml
          git commit -m "Improve software candidate relevance ranking"
          git push origin HEAD:fix/resolve-whole-software-world
