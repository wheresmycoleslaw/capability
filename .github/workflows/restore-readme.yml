name: Restore Capability README
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-readme.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore README from pre-accidental revision
        run: git show 4713564d472d6450235f041557a35cd112aad573:README.md > README.md
      - name: Commit restoration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Restore Capability README'
          git push origin HEAD:main
