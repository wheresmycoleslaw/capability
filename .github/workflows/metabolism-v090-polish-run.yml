name: Run Capability 0.9 Polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metabolism-v090-polish-run.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Apply polish
        run: python scripts/polish-v090.py
      - name: Verify
        run: |
          npm install --ignore-scripts
          npm run registry:check
          npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/polish-v090.py
          git add src/metabolism.ts README.md CHANGELOG.md test/metabolism.test.mjs
          git commit -m 'Document Capability 0.9 metabolic coverage precisely'
          git push origin HEAD:main
