name: Finalize Capability 0.9 Metabolic Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metabolism-v090-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire generalized metabolism surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Replace the provisional PyPI implementation with the exact-wheel binder.
          p=Path('src/metabolism.ts'); s=p.read_text()
          start=s.index('type PyPiFile =')
          end=s.index('export type MetabolizeResult')
          replacement='''imported-placeholder'''
          # Re-exporting is placed at module top; remove the provisional implementation only.
          s=s[:start]+s[end:]
          marker='import { validateManifest } from "./manifest.js";\n'
          pypi_import='import { executePyPiAbility, forgePyPiAbility, inspectPyPiPackage, minePyPiArtifact } from "./pypi.js";\nexport { executePyPiAbility, forgePyPiAbility, inspectPyPiPackage, minePyPiArtifact } from "./pypi.js";\nexport type { PyPiInspection, PythonCandidate, PythonExecutionReceipt, PythonForge, PythonMiningReport } from "./pypi.js";\n'
          if 'from "./pypi.js"' not in s:
              s=s.replace(marker, marker+pypi_import)
          s=s.replace('Pure-Python wheel functions and console scripts; artifact SHA256 is verified before mining.', 'Universal Python wheel functions and console scripts; exact wheel bytes are SHA256-verified, stored with the binding, and executed with no dependency/network drift.')
          p.write_text(s)

          # Runtime-generated projects and Forge should target this release.
          for file in ['src/scaffold.ts','src/forge.ts']:
              p=Path(file); s=p.read_text().replace('^0.8.1','^0.9.0'); p.write_text(s)

          # Public exports.
          p=Path('src/index.ts'); s=p.read_text()
          for line in [
              'export * from "./pypi.js";',
              'export * from "./binders.js";',
              'export * from "./default-binders.js";',
              'export * from "./metabolic-compose.js";',
              'export * from "./gap-scaffold.js";'
          ]:
              if line not in s: s += '\n'+line
          p.write_text(s.rstrip()+'\n')

          # CLI: composition and gap -> project loop.
          p=Path('src/cli.ts'); s=p.read_text()
          marker='import { createCapabilityGap, executeOciImage, executePyPiAbility, forgePyPiAbility, inspectOciImage, inspectPyPiPackage, metabolizeIntent, metabolicCoverage, minePyPiArtifact, planComposition } from "./metabolism.js";\n'
          extra='import { composeIntent } from "./metabolic-compose.js";\nimport { scaffoldCapabilityGapProject } from "./gap-scaffold.js";\nimport type { CapabilityGap } from "./metabolism.js";\n'
          if 'from "./metabolic-compose.js"' not in s: s=s.replace(marker, marker+extra)
          usage_anchor='  cap gap <intent> [--effect <effect>...]\n'
          if 'cap compose-intent' not in s:
              s=s.replace(usage_anchor, usage_anchor+'  cap compose-intent <pipeline> [--input <json>] [--approve] [--index <url>]\n  cap build-gap <gap.json> <directory> [--name <package>] [--id <capability-id>] [--repo <url>] [--force]\n')

          old='''  if (command === "gap") {\n    const effects = takeOptions(args, "--effect") as CapabilityEffect[];\n    const intent = args.join(" ").trim();\n    if (!intent) usage();\n    console.log(JSON.stringify(createCapabilityGap(intent, { effectsCeiling: effects }), null, 2));\n    return;\n  }\n'''
          new='''  if (command === "gap") {\n    const effects = takeOptions(args, "--effect") as CapabilityEffect[];\n    const out = takeOption(args, "--out");\n    const intent = args.join(" ").trim();\n    if (!intent) usage();\n    const gap = createCapabilityGap(intent, { effectsCeiling: effects });\n    if (out) await writeFile(resolve(out), `${JSON.stringify(gap, null, 2)}\\n`, "utf8");\n    console.log(JSON.stringify(gap, null, 2));\n    return;\n  }\n\n  if (command === "build-gap") {\n    const packageName = takeOption(args, "--name");\n    const capabilityId = takeOption(args, "--id");\n    const repository = takeOption(args, "--repo");\n    const force = takeFlag(args, "--force");\n    const gapPath = args.shift() ?? usage();\n    const directory = args.shift() ?? usage();\n    if (args.length) usage();\n    const gap = JSON.parse(await readFile(resolve(gapPath), "utf8")) as CapabilityGap;\n    console.log(JSON.stringify(await scaffoldCapabilityGapProject(gap, { directory, packageName, capabilityId, repository, force }), null, 2));\n    return;\n  }\n\n  if (command === "compose-intent") {\n    const inputRaw = takeOption(args, "--input");\n    const approved = takeFlag(args, "--approve");\n    const indexes = liveIndexes(args);\n    const intent = args.join(" ").trim();\n    if (!intent) usage();\n    const result = await composeIntent(intent, { indexes, ...(inputRaw !== undefined ? { input: parseJson(inputRaw) } : {}), approved });\n    console.log(JSON.stringify(result, null, 2));\n    process.exitCode = result.route === "gap" ? 2 : 0;\n    return;\n  }\n'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          # MCP: expose metabolism, composition and coverage as bootstrap primitives.
          p=Path('src/network-mcp.ts'); s=p.read_text()
          marker='import { activateForgedAbility, forgeGitHubAbility, solveSoftwareIntent } from "./forge.js";\n'
          extra='import { metabolizeIntent, metabolicCoverage } from "./metabolism.js";\nimport { composeIntent } from "./metabolic-compose.js";\n'
          if 'metabolicCoverage' not in s: s=s.replace(marker,marker+extra)
          tool_anchor='''  {\n    name: "capability_inspect",'''
          tools='''  {\n    name: "capability_metabolize",\n    title: "Metabolize Existing Software",\n    description: "Start from an outcome and acquire a defensible ability through native Capability, npm/GitHub Forge, an explicitly selected PyPI package, or an OCI image. External bindings remain authority-incomplete and require approval for first execution.",\n    inputSchema: { type: "object", properties: { query: { type: "string" }, input: {}, approved: { type: "boolean", default: false }, pythonPackage: { type: "string" }, pythonVersion: { type: "string" }, ociImage: { type: "string" }, ociArgs: { type: "array", items: { type: "string" } }, externalOnly: { type: "boolean", default: false } }, required: ["query"] },\n    annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: true }\n  },\n  {\n    name: "capability_compose",\n    title: "Compose Capability Pipeline",\n    description: "Split an explicit multi-step intent, discover candidate Capability contracts for each step, require schema-compatible boundaries, synthesize a composite manifest and optionally execute the pipeline with a receipt for every step.",\n    inputSchema: { type: "object", properties: { intent: { type: "string" }, input: {}, approved: { type: "boolean", default: false } }, required: ["intent"] },\n    annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: true }\n  },\n  {\n    name: "capability_coverage",\n    title: "Capability Metabolic Coverage",\n    description: "Report which software substrate families Capability can currently discover, mine, bind and execute, without inventing a percentage of all software.",\n    inputSchema: { type: "object", properties: {} },\n    annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }\n  },\n'''
          if 'name: "capability_metabolize"' not in s: s=s.replace(tool_anchor,tools+tool_anchor)
          call_anchor='''      if (name === "capability_inspect") {'''
          calls='''      if (name === "capability_metabolize") {\n        const query = typeof args.query === "string" ? args.query : "";\n        if (!query) throw new TypeError("query is required");\n        return textResult(await metabolizeIntent(query, {\n          indexes: this.indexes,\n          ...(args.input !== undefined ? { input: args.input } : {}),\n          approved: args.approved === true,\n          pythonPackage: typeof args.pythonPackage === "string" ? args.pythonPackage : undefined,\n          pythonVersion: typeof args.pythonVersion === "string" ? args.pythonVersion : undefined,\n          ociImage: typeof args.ociImage === "string" ? args.ociImage : undefined,\n          ociArgs: Array.isArray(args.ociArgs) ? args.ociArgs.filter((value): value is string => typeof value === "string") : undefined,\n          externalOnly: args.externalOnly === true\n        }));\n      }\n      if (name === "capability_compose") {\n        const intent = typeof args.intent === "string" ? args.intent : "";\n        if (!intent) throw new TypeError("intent is required");\n        return textResult(await composeIntent(intent, { indexes: this.indexes, ...(args.input !== undefined ? { input: args.input } : {}), approved: args.approved === true }));\n      }\n      if (name === "capability_coverage") return textResult(metabolicCoverage());\n'''
          if 'if (name === "capability_metabolize")' not in s: s=s.replace(call_anchor,calls+call_anchor)
          p.write_text(s)

          # Package exports and shipped docs/schemas.
          p=Path('package.json'); pkg=json.loads(p.read_text())
          exports={
            './pypi': {'types':'./dist/pypi.d.ts','import':'./dist/pypi.js'},
            './binders': {'types':'./dist/binders.d.ts','import':'./dist/binders.js'},
            './default-binders': {'types':'./dist/default-binders.d.ts','import':'./dist/default-binders.js'},
            './metabolic-compose': {'types':'./dist/metabolic-compose.d.ts','import':'./dist/metabolic-compose.js'},
            './gap-scaffold': {'types':'./dist/gap-scaffold.d.ts','import':'./dist/gap-scaffold.js'}
          }
          pkg['exports'].update(exports)
          for file in ['BINDERS.md','capability-gap.schema.json']:
              if file not in pkg['files']: pkg['files'].append(file)
          p.write_text(json.dumps(pkg,indent=2)+'\n')

          # Add tests for binder registry and gap/composition primitives.
          Path('test/metabolic-binders.test.mjs').write_text(r'''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { MetabolicBinderRegistry } from "../dist/binders.js";\nimport { createDefaultMetabolicBinderRegistry } from "../dist/default-binders.js";\nimport { splitPipelineIntent } from "../dist/metabolic-compose.js";\n\ntest("default binders generalize by substrate", () => {\n  const rows=createDefaultMetabolicBinderRegistry().list();\n  assert.deepEqual(new Set(rows.map((x)=>x.substrate)), new Set(["npm","pypi","oci"]));\n  assert.ok(rows.every((x)=>x.executable));\n});\n\ntest("binder ids are unique", () => {\n  const registry=new MetabolicBinderRegistry();\n  const binder={id:"demo/x",substrate:"demo",discovery:"explicit",description:"demo",async bind(){return {binderId:"demo/x",substrate:"demo",locator:"x",authority:{complete:false,effects:[]},evidence:[]}}};\n  registry.register(binder);\n  assert.throws(()=>registry.register(binder),/already registered/);\n});\n\ntest("pipeline intent is split without inventing hidden steps", () => {\n  assert.deepEqual(splitPipelineIntent("normalize text then slugify text"),["normalize text","slugify text"]);\n  assert.deepEqual(splitPipelineIntent("extract -> transform -> render"),["extract","transform","render"]);\n});\n'''.replace('\\n','\n'))
          PY

          npm install --ignore-scripts
          npm run registry
          npm test

      - name: Live substrate smoke before release
        run: |
          set -euo pipefail
          node dist/cli.js coverage > /tmp/coverage.json
          grep -q '"substrate": "pypi"' /tmp/coverage.json
          grep -q '"substrate": "oci"' /tmp/coverage.json
          grep -q '"substrate": "composition"' /tmp/coverage.json

          node dist/cli.js pypi-inspect inflection > /tmp/pypi-inspect.json
          grep -q '"name": "inflection"\|"name": "Inflection"' /tmp/pypi-inspect.json
          node dist/cli.js pypi-mine inflection --query 'camelize text' > /tmp/pypi-mine.json
          grep -q '"symbol": "camelize"' /tmp/pypi-mine.json
          node dist/cli.js pypi-forge inflection --query 'camelize text' --symbol camelize --execute '{"args":["hello_world"]}' --approve > /tmp/pypi-run.json
          grep -q '"artifactVerified": true' /tmp/pypi-run.json
          grep -q '"network": "none"' /tmp/pypi-run.json
          grep -q 'HelloWorld' /tmp/pypi-run.json

          node dist/cli.js oci-inspect busybox:1.36 > /tmp/oci-inspect.json
          grep -q '@sha256:' /tmp/oci-inspect.json
          node dist/cli.js oci-run busybox:1.36 echo capability-oci-ok --approve > /tmp/oci-run.json
          grep -q '"status": "succeeded"' /tmp/oci-run.json
          grep -q 'capability-oci-ok' /tmp/oci-run.json

          node dist/cli.js compose-intent 'normalize text then slugify text' > /tmp/compose.json
          grep -q '"route": "composition"' /tmp/compose.json
          grep -q 'text/normalize' /tmp/compose.json
          grep -q 'text/slugify' /tmp/compose.json

          node dist/cli.js gap 'perform a deliberately unresolved proof operation' --out /tmp/gap.json > /tmp/gap-stdout.json
          grep -q '"status": "unresolved"' /tmp/gap.json
          node dist/cli.js build-gap /tmp/gap.json /tmp/gap-project --force > /tmp/gap-project.json
          test -f /tmp/gap-project/capability-gap.json
          grep -q 'capability-gap.json' /tmp/gap-project/package.json

      - name: Commit finalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src package.json package-lock.json registry/index.json README.md METABOLISM.md BINDERS.md capability-gap.schema.json test
          git commit -m 'Capability 0.9: complete metabolic binder, composition, and gap loop'
          git push origin HEAD:main
