name: Prepare Capability Solve Intent Gate

on:
  push:
    branches: [solve-v0.8.1]
    paths:
      - .github/workflows/solve-intent-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solve-v0.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add conservative native intent-fit gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/forge.ts')
          text = p.read_text()
          marker = '''function slug(value: string): string {\n'''
          addition = '''const INTENT_STOPWORDS = new Set(["a", "an", "the", "to", "of", "for", "in", "on", "at", "by", "with", "and", "or", "from", "into", "this", "that", "my", "your", "its", "please"]);\n\nfunction intentTokens(value: string): string[] {\n  return [...new Set(value.toLowerCase().split(/[^a-z0-9]+/g).filter((token) => token.length > 1 && !INTENT_STOPWORDS.has(token)))];\n}\n\nexport function assessNativeIntentFit(query: string, candidate: { id: string; name: string; description: string }): { accepted: boolean; coverage: number; matched: string[]; missing: string[] } {\n  const queryTokens = intentTokens(query);\n  const candidateTokens = new Set(intentTokens(`${candidate.id} ${candidate.name} ${candidate.description}`));\n  const matched = queryTokens.filter((token) => candidateTokens.has(token));\n  const missing = queryTokens.filter((token) => !candidateTokens.has(token));\n  const coverage = queryTokens.length ? matched.length / queryTokens.length : 0;\n  // Lexical discovery is a locator, not proof that the ability satisfies the request.\n  // Require a majority of the actual intent vocabulary before auto-selecting a native ability.\n  // Otherwise continue into external discovery/Forge rather than executing a plausible-but-wrong tool.\n  return { accepted: queryTokens.length > 0 && coverage >= 0.6, coverage, matched, missing };\n}\n\n'''
          if marker not in text: raise SystemExit('slug marker missing')
          text = text.replace(marker, addition + marker, 1)

          old = '''  if (!options.externalOnly && discovery.native[0]) {\n    const top = discovery.native[0];\n    let receipt: CapabilityReceipt | undefined;\n    if (options.input !== undefined) {\n      const hub = new CapabilityHub({ indexes });\n      const execution = await hub.run(top.id, options.input, { approved: options.approved === true });\n      receipt = execution.receipt;\n    }\n    return {\n      query,\n      route: "native",\n      discovery,\n      native: { id: top.id, package: top.package, ...(receipt ? { receipt } : {}) },\n      attempts\n    };\n  }\n'''
          new = '''  if (!options.externalOnly) {\n    const nativeMatch = discovery.native.map((candidate) => ({ candidate, fit: assessNativeIntentFit(query, candidate) })).find((entry) => entry.fit.accepted);\n    if (nativeMatch) {\n      const top = nativeMatch.candidate;\n      let receipt: CapabilityReceipt | undefined;\n      if (options.input !== undefined) {\n        const hub = new CapabilityHub({ indexes });\n        const execution = await hub.run(top.id, options.input, { approved: options.approved === true });\n        receipt = execution.receipt;\n      }\n      return {\n        query,\n        route: "native",\n        discovery,\n        native: { id: top.id, package: top.package, intentFit: nativeMatch.fit, ...(receipt ? { receipt } : {}) },\n        attempts\n      };\n    }\n  }\n'''
          if old not in text: raise SystemExit('native routing marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('native?: { id: string; package: string; receipt?: CapabilityReceipt };', 'native?: { id: string; package: string; intentFit: ReturnType<typeof assessNativeIntentFit>; receipt?: CapabilityReceipt };', 1)
          p.write_text(text)

          p = Path('test/forge.test.mjs')
          text = p.read_text()
          text = text.replace('import { forgeGitHubAbility } from "../dist/forge.js";', 'import { assessNativeIntentFit, forgeGitHubAbility } from "../dist/forge.js";', 1)
          marker = '''test("forges a mined repository function into an exact npm-backed inert capability", async () => {'''
          addition = '''test("intent fit refuses a lexical native near-miss but accepts a specific native match", () => {\n  const normalize = { id: "text/normalize", name: "Normalize Text", description: "Normalize whitespace, surrounding space, and letter case in text." };\n  const slugify = { id: "text/slugify", name: "Slugify Text", description: "Convert text to a deterministic URL-friendly slug." };\n  const miss = assessNativeIntentFit("convert separated text to camel case", normalize);\n  assert.equal(miss.accepted, false);\n  assert.ok(miss.missing.includes("camel"));\n  const hit = assessNativeIntentFit("slugify text", slugify);\n  assert.equal(hit.accepted, true);\n  assert.equal(hit.coverage, 1);\n});\n\n'''
          if marker not in text: raise SystemExit('forge test marker missing')
          p.write_text(text.replace(marker, addition + marker, 1))
          PY
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      - name: Commit verified gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/forge.ts test/forge.test.mjs
          git commit -m "Gate native Solve routing by intent fit"
          git push origin HEAD:solve-v0.8.1
