name: Finalize Capability 1.0 Branch

on:
  push:
    branches: [capability-1.0]
    paths:
      - STABILITY.md

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capability-1.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze 1.0 package surface
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const read = async (path) => readFile(path, 'utf8');
          const write = async (path, text) => writeFile(path, text, 'utf8');

          const pkg = JSON.parse(await read('package.json'));
          pkg.version = '1.0.0';
          pkg.description = 'The stable Capability 1.x software-metabolism protocol and reference runtime for agents to discover, bind, authorize, isolate, compose, and acquire abilities from existing software.';
          pkg.exports['./protocol'] = { types: './dist/protocol.d.ts', import: './dist/protocol.js' };
          pkg.exports['./conformance'] = { types: './dist/conformance.d.ts', import: './dist/conformance.js' };
          for (const file of [
            'STABILITY.md', 'CONFORMANCE.md', 'stability-lock.json',
            'metabolic-binding.schema.json', 'metabolic-execution-receipt.schema.json',
            'capability-receipt.schema.json'
          ]) if (!pkg.files.includes(file)) pkg.files.push(file);
          pkg.scripts.conformance = "npm run build && node --input-type=module -e \"import('./dist/conformance.js').then(async m => m.assertProtocolConformance())\"";
          await write('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(await read('package-lock.json'));
          lock.version = '1.0.0';
          if (lock.packages?.['']) lock.packages[''].version = '1.0.0';
          await write('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          let scaffold = await read('src/scaffold.ts');
          scaffold = scaffold.replace('const CAPABILITY_RUNTIME_VERSION = "^0.9.0";', 'const CAPABILITY_RUNTIME_VERSION = "^1.0.0";');
          await write('src/scaffold.ts', scaffold);

          let mcp = await read('src/mcp-server.ts');
          mcp = mcp.replace('const SERVER_INFO = { name: "capability-network", version: "0.8.0" };', 'const SERVER_INFO = { name: "capability-network", version: "1.0.0" };');
          mcp = mcp.replace(
            'Use capability_search for native abilities, capability_search_world to discover existing software, capability_mine_repository to inspect source without executing it, capability_forge_repository to bind a selected operation to an exact artifact, or capability_solve to go from an outcome to a native/forged ability. Review authority before any execution.',
            'Capability 1.x exposes stable discovery and metabolism contracts. Use capability_search for native abilities, capability_search_world to discover existing software, capability_mine_repository to inspect source without executing it, capability_forge_repository to bind a selected operation to an exact artifact, or capability_solve to go from an outcome to a native/forged ability. Review authority before any execution.'
          );
          await write('src/mcp-server.ts', mcp);

          let index = await read('src/index.ts');
          for (const line of ['export * from "./protocol.js";', 'export * from "./conformance.js";']) {
            if (!index.includes(line)) index = index.trimEnd() + '\n' + line + '\n';
          }
          await write('src/index.ts', index);

          let readme = await read('README.md');
          readme = readme.replace(
            '`@wheresmycoleslaw/capability` is an experimental TypeScript standard, runtime, CLI, developer kit, and federated public index for self-describing executable capabilities.',
            '`@wheresmycoleslaw/capability` is the stable Capability 1.x protocol and reference runtime: a TypeScript runtime, CLI, developer kit, federated discovery layer, and generalized software-metabolism boundary for agents. The public 1.x contracts are stable; executing untrusted external software remains security-sensitive and threat-model dependent.'
          );
          readme = readme.replaceAll('Capability 0.9', 'Capability 1.0');
          const stabilityBlock = `\n## Capability 1.0 stability\n\nCapability 1.0 freezes the load-bearing public contracts for the 1.x line. New substrate binders, tools, effects and discovery systems can be added without redesigning the protocol. Incompatible changes to the stable package exports, binder envelope, authority/artifact invariants, MCP bootstrap surface, or documented command semantics require a new major version.\n\nRun the network-free protocol conformance suite with:\n\n\`\`\`bash\nnpm run conformance\n\`\`\`\n\nSee [STABILITY.md](./STABILITY.md) and [CONFORMANCE.md](./CONFORMANCE.md).\n`;
          if (!readme.includes('## Capability 1.0 stability')) readme = readme.replace('\n## Software metabolism\n', stabilityBlock + '\n## Software metabolism\n');
          await write('README.md', readme);

          let metabolism = await read('METABOLISM.md');
          metabolism = metabolism.replace('Capability 0.9 completes the **general architecture and feedback loop** for software metabolism; it does not claim that the reference implementation can execute every useful function in every software project.', 'Capability 1.0 stabilizes the **general architecture and feedback loop** for software metabolism behind a public 1.x compatibility contract; it does not claim that the reference implementation can execute every useful function in every software project.');
          metabolism = metabolism.replaceAll('Capability 0.9', 'Capability 1.0');
          await write('METABOLISM.md', metabolism);

          let changelog = await read('CHANGELOG.md');
          if (!changelog.includes('## 1.0.0')) {
            const entry = `# Changelog\n\n## 1.0.0\n\n- declare the Capability 1.x public compatibility line and publish an explicit stability contract instead of treating 1.0 as a cosmetic package-version milestone\n- harden the generalized \`MetabolicBinder\` boundary: executable bindings now require a versioned envelope, immutable artifact identity, binding time, evidence, and truthful authority completeness\n- enforce incomplete-authority approval centrally in \`MetabolicBinderRegistry\`, so third-party binders cannot accidentally bypass the minimum 1.x authority invariant\n- add a stable substrate-neutral metabolic execution receipt that preserves binder/substrate identity, exact artifact, authority, evidence, timing, isolation and optional upstream receipts\n- add runtime validation plus JSON Schemas for 1.0 metabolic bindings and receipts, and add a machine-readable schema for native Capability receipts\n- add \`capabilityProtocolInfo()\`, 1.x compatibility helpers, \`runProtocolConformance()\`, \`assertProtocolConformance()\`, and \`runBinderConformance()\`\n- add \`stability-lock.json\` and release tests that prevent locked package exports, MCP bootstrap tools, documented CLI commands, or format versions from silently disappearing during 1.x\n- add dedicated STABILITY and CONFORMANCE documentation and rewrite the specification as the stable 1.x protocol contract while retaining independent deployed document-format versions\n- update generated adopter projects to target \`^1.0.0\` and update MCP server identity to 1.0.0\n- preserve the 0.9 metabolism architecture and released proofs across npm/GitHub Forge, exact-wheel PyPI/Python, immutable OCI, repository mining, MCP/OpenAPI, runtime composition and machine-readable capability gaps\n\n`;
            changelog = changelog.replace(/^# Changelog\n+/, entry);
          }
          await write('CHANGELOG.md', changelog);
          NODE
      - name: Regenerate registry for 1.0.0
        run: npm run registry
      - name: Commit stabilized branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json registry/index.json src/scaffold.ts src/mcp-server.ts src/index.ts README.md METABOLISM.md CHANGELOG.md
          git commit -m "Stabilize Capability 1.0 public contracts"
          git push origin HEAD:capability-1.0
