name: Ecosystem Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  live-ecosystem:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Install released CLI
        run: |
          VERSION=$(cat .release)
          npm install --global "@wheresmycoleslaw/capability@$VERSION"
      - run: cap doctor
      - name: Search beyond the Capability registry
        run: |
          cap world "typescript compiler" --no-github --limit 3 > /tmp/world.json
          grep -q '"kind": "external"' /tmp/world.json
          grep -q '"source": "npm"' /tmp/world.json
      - name: Inspect an existing npm package without installing it
        run: |
          cap npm-inspect typescript > /tmp/npm-inspect.json
          grep -q '"name": "typescript"' /tmp/npm-inspect.json
          grep -q '"tsc"' /tmp/npm-inspect.json
      - name: Probe the public web bootstrap
        run: |
          cap probe https://sithix.com > /tmp/site.json
          grep -q '"capabilityDiscoveryVersion": "0.1"' /tmp/site.json
          grep -q '"name": "@wheresmycoleslaw/capability"' /tmp/site.json
          grep -q 'raw.githubusercontent.com/wheresmycoleslaw/capability/main/registry/index.json' /tmp/site.json
      - name: Bootstrap through MCP without preloading the network
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | cap mcp-serve > /tmp/mcp.jsonl
          grep -q '2026-07-28' /tmp/mcp.jsonl
          grep -q 'capability_search' /tmp/mcp.jsonl
          grep -q 'capability_search_world' /tmp/mcp.jsonl
          grep -q 'capability_probe_site' /tmp/mcp.jsonl
      - name: Import an unchanged MCP server as Capability contracts
        run: |
          cap mcp-import cap mcp-serve --namespace bootstrap > /tmp/mcp-import.json
          grep -q 'bootstrap/capability_search_world' /tmp/mcp-import.json
          grep -q 'custom:mcp.opaque-effects' /tmp/mcp-import.json
      - name: Discover new agent-native capability
        run: |
          cap find "failure frontier" > /tmp/capability-find.json
          grep -q 'capability/failure-frontier' /tmp/capability-find.json
      - name: Scaffold a fresh adopter project
        run: |
          cap create /tmp/hello-capability --name hello-capability --id hello/run --description "A clean-room adoption smoke capability."
          cap readiness /tmp/hello-capability/package.json > /tmp/readiness.json
          grep -q '"ok": true' /tmp/readiness.json
          grep -q 'id-token: write' /tmp/hello-capability/.github/workflows/publish.yml
      - name: Execute new invention through Node isolation
        run: |
          cap exec capability/failure-frontier '{"steps":[{"id":"read","effects":["filesystem.read"],"behavior":{"idempotent":true,"reversible":false}},{"id":"write","effects":["filesystem.write"],"behavior":{"idempotent":true,"reversible":true}},{"id":"send","effects":["email.send"],"behavior":{"idempotent":false,"reversible":false}}]}' --executor=node > /tmp/frontier.json
          grep -q '"pointOfNoReturn":"send"\|"pointOfNoReturn": "send"' /tmp/frontier.json
      - name: Execute through Docker isolation
        run: |
          docker pull node:24-alpine
          cap exec capability/authority-envelope '{"manifests":[{"specVersion":"0.1","id":"demo/read","version":"1.0.0","name":"Read","description":"read","effects":["filesystem.read"],"behavior":{"deterministic":true,"idempotent":true,"reversible":false}}],"requiredEffects":["filesystem.read"]}' --executor=docker > /tmp/authority.json
          grep -q '"riskScore"' /tmp/authority.json
