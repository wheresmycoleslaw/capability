name: Bootstrap discovery release patch

on:
  push:
    branches: [bootstrap-discovery-v0.5]
    paths:
      - .github/workflows/bootstrap-discovery-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-discovery-v0.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch package, CLI, docs, and registry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version = '0.5.0';
          pkg.description = 'An open standard, runtime, MCP bootstrap bridge, developer kit, and federated discovery network for safely discoverable executable abilities for AI agents.';
          pkg.exports['./web-discovery'] = { types: './dist/web-discovery.d.ts', import: './dist/web-discovery.js' };
          pkg.exports['./network-mcp'] = { types: './dist/network-mcp.d.ts', import: './dist/network-mcp.js' };
          for (const file of ['DISCOVERY.md','capability-site.schema.json']) if (!pkg.files.includes(file)) pkg.files.push(file);
          for (const word of ['agent-discovery','well-known','mcp-server','tool-discovery','dynamic-tools']) if (!pkg.keywords.includes(word)) pkg.keywords.push(word);
          pkg.homepage = 'https://sithix.com/capability';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let cli = fs.readFileSync('src/cli.ts','utf8');
          if (!cli.includes('from "./web-discovery.js"')) {
            cli = cli.replace('import type { CapabilityManifest } from "./types.js";', 'import type { CapabilityManifest } from "./types.js";\nimport { probeCapabilitySite } from "./web-discovery.js";');
          }
          cli = cli.replace('Live ecosystem:\n  cap find', 'Live ecosystem:\n  cap probe <site>\n  cap mcp-serve [--index <url>]\n  cap find');
          const anchor = '  if (command === "create") {';
          if (!cli.includes('command === "mcp-serve"')) {
            cli = cli.replace(anchor, `  if (command === "mcp-serve") {\n    const index = takeOption(args, "--index");\n    if (args.length) usage();\n    if (index) process.env.CAPABILITY_INDEX = index;\n    await import("./mcp-server.js");\n    return;\n  }\n\n  if (command === "probe") {\n    const site = args.shift() ?? usage();\n    if (args.length) usage();\n    console.log(JSON.stringify(await probeCapabilitySite(site), null, 2));\n    return;\n  }\n\n${anchor}`);
          }
          fs.writeFileSync('src/cli.ts', cli);

          let readme = fs.readFileSync('README.md','utf8');
          if (!readme.includes('## Bootstrap discovery')) {
            const section = `## Bootstrap discovery\n\nCapability can now be found and entered from outside its own ecosystem instead of assuming the client already knows the protocol.\n\n**From an MCP host:**\n\n\`\`\`bash\nnpx -y @wheresmycoleslaw/capability mcp-serve\n\`\`\`\n\nThe bridge gives the agent five stable tools—search, inspect, execute, website probe, and doctor—without dumping the entire Capability network into the model context.\n\n**From a website:**\n\nParticipating sites advertise one or more indexes at \`/.well-known/capabilities\` (or the \`.json\` fallback). Probe one with:\n\n\`\`\`bash\ncap probe https://example.com\n\`\`\`\n\nSee [DISCOVERY.md](./DISCOVERY.md) for the bootstrap architecture and site descriptor format.\n\n`;
            readme = readme.replace('## Create a capability', section + '## Create a capability');
          }
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md','utf8');
          if (!changelog.includes('## 0.5.0')) {
            changelog = changelog.replace('# Changelog\n', `# Changelog\n\n## 0.5.0\n\n- bootstrap discovery layer so developers and agents can find Capability before already knowing about it\n- \`/.well-known/capabilities\` website discovery convention and JSON Schema\n- \`cap probe <site>\` for zero-configuration domain discovery\n- executable \`cap mcp-serve\` bootstrap bridge exposing network search, inspection, verified isolated execution, website probing, and readiness checks\n- MCP compatibility across modern \`server/discover\` negotiation and legacy \`initialize\` clients\n- machine-readable \`llms.txt\` discovery guide\n- public SITHIX landing page and search-engine bootstrap surface\n- live registry moved to the 0.5.0 package artifact after release\n`);
          }
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.mkdirSync('docs/.well-known', { recursive: true });
          const discovery = {
            capabilityDiscoveryVersion: '0.1',
            indexes: ['https://raw.githubusercontent.com/wheresmycoleslaw/capability/main/registry/index.json'],
            package: { name: '@wheresmycoleslaw/capability', version: '0.5.0' },
            mcp: [{ transport: 'stdio', command: 'npx', args: ['-y','@wheresmycoleslaw/capability','mcp-serve'] }],
            documentation: 'https://sithix.com/capability',
            repository: 'https://github.com/wheresmycoleslaw/capability'
          };
          fs.writeFileSync('docs/.well-known/capabilities', JSON.stringify(discovery, null, 2) + '\n');
          fs.writeFileSync('docs/.well-known/capabilities.json', JSON.stringify(discovery, null, 2) + '\n');
          NODE
          npm install --ignore-scripts
          npm run registry
      - name: Commit generated release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/cli.ts README.md CHANGELOG.md registry/index.json docs/.well-known/capabilities docs/.well-known/capabilities.json
          git commit -m "Prepare Capability 0.5 bootstrap discovery release"
          git push origin HEAD:bootstrap-discovery-v0.5
