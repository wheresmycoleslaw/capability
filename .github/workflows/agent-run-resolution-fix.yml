name: Agent run resolver repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-whole-software-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and run the one-shot repair script
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/agent-apply-resolution-fix.yml').read_text()
          start = text.index("          node <<'NODE'\n") + len("          node <<'NODE'\n")
          end = text.index("\n          NODE\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace('throw new Error(`unexpected URL: ${url}`);', 'throw new Error("unexpected URL: " + url);')
          Path('/tmp/apply-resolution-fix.cjs').write_text(script)
          PY
          node /tmp/apply-resolution-fix.cjs
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/need.ts')
          text = path.read_text()
          old = 'capabilities: readonly Capability[];'
          if old not in text:
              raise SystemExit('providerFromCapabilities Capability type marker missing')
          path.write_text(text.replace(old, 'capabilities: readonly Capability<any, any>[];', 1))

          path = Path('src/builtin-provider.ts')
          text = path.read_text()
          old = 'export const builtinCapabilities: readonly Capability[] = Object.freeze(['
          if old not in text:
              raise SystemExit('builtinCapabilities type marker missing')
          path.write_text(text.replace(old, 'export const builtinCapabilities: readonly Capability<any, any>[] = Object.freeze([', 1))
          PY
      - name: Install and verify
        run: |
          npm install --ignore-scripts
          npm test
          npm pack --dry-run
      - name: Commit only the verified repair
        run: |
          rm .github/workflows/agent-apply-resolution-fix.yml .github/workflows/agent-run-resolution-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/external-discovery.ts src/need.ts src/builtin-provider.ts src/index.ts test/external-resolution.test.mjs test/need.test.mjs .github/workflows/agent-apply-resolution-fix.yml .github/workflows/agent-run-resolution-fix.yml
          git commit -m "Fix ability resolution across the software world"
          git push origin HEAD:fix/resolve-whole-software-world
