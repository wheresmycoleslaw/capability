name: Prepare Capability Solve 0.8.1

on:
  push:
    branches: [solve-v0.8.1]
    paths:
      - .github/workflows/solve-v081-prepare.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solve-v0.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix ephemeral Forge execution and improve solver candidate routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/forge.ts',
              'import { mkdtemp, readFile, writeFile } from "node:fs/promises";',
              'import { chmod, mkdtemp, readFile, writeFile } from "node:fs/promises";')
          replace('src/forge.ts',
              'export const CAPABILITY_FORGE_RUNTIME_VERSION = "^0.8.0" as const;',
              'export const CAPABILITY_FORGE_RUNTIME_VERSION = "^0.8.1" as const;')
          replace('src/forge.ts',
              '  const candidate = chooseCandidate(report, options);\n  const directory = resolve(options.directory ?? await mkdtemp(join(tmpdir(), "capability-forge-")));\n  let project: ForgedAbility["project"];',
              '  const candidate = chooseCandidate(report, options);\n  let directory: string;\n  if (options.directory) {\n    directory = resolve(options.directory);\n  } else {\n    directory = resolve(await mkdtemp(join(tmpdir(), "capability-forge-")));\n    // mkdtemp intentionally creates 0700 directories. Docker first-run executes as a non-root UID,\n    // so the generated package root must be traversable without making its files writable.\n    await chmod(directory, 0o755);\n  }\n  let project: ForgedAbility["project"];')
          replace('src/forge.ts',
              '  const repositories = [...new Set(discovery.external.map((entry) => entry.repository).filter((value): value is string => Boolean(value && /github\\.com/i.test(value))))];\n  for (const [index, repository] of repositories.slice(0, options.maxForgeAttempts ?? 4).entries()) {',
              '  const forgeableExternal = [...discovery.external].sort((a, b) => {\n    // Forge currently binds npm-backed repositories. Prefer npm search hits over bare GitHub hits\n    // so intent-first solving spends its bounded attempts on candidates with an installable artifact.\n    const artifactBias = (entry: typeof a) => entry.source === "npm" ? 1 : 0;\n    return artifactBias(b) - artifactBias(a) || b.score - a.score || a.sourceRank - b.sourceRank;\n  });\n  const repositories = [...new Set(forgeableExternal.map((entry) => entry.repository).filter((value): value is string => Boolean(value && /github\\.com/i.test(value))))];\n  for (const [index, repository] of repositories.slice(0, options.maxForgeAttempts ?? 6).entries()) {')

          replace('src/scaffold.ts', 'const CAPABILITY_RUNTIME_VERSION = "^0.8.0";', 'const CAPABILITY_RUNTIME_VERSION = "^0.8.1";')
          replace('test/adoption.test.mjs', 'assert.equal(pkg.dependencies["@wheresmycoleslaw/capability"], "^0.8.0");', 'assert.equal(pkg.dependencies["@wheresmycoleslaw/capability"], "^0.8.1");')
          replace('test/forge.test.mjs', 'assert.equal(pkg.dependencies["@wheresmycoleslaw/capability"], "^0.8.0");', 'assert.equal(pkg.dependencies["@wheresmycoleslaw/capability"], "^0.8.1");')
          replace('test/forge.test.mjs',
              'import { mkdtemp, readFile } from "node:fs/promises";',
              'import { mkdtemp, readFile, stat } from "node:fs/promises";')
          marker = '''test("refuses first execution source binding when npm cannot prove a gitHead", async () => {'''
          addition = '''test("default Forge temp roots are traversable by the non-root Docker executor", async () => {\n  const forged = await forgeGitHubAbility("acme/text-kit", {\n    fetch: fixtureFetch(),\n    query: "normalize text",\n    symbol: "normalizeText"\n  });\n  const mode = (await stat(forged.project.directory)).mode & 0o777;\n  assert.notEqual(mode & 0o111, 0, `expected executable directory bits, received ${mode.toString(8)}`);\n});\n\n'''
          p = Path('test/forge.test.mjs')
          text = p.read_text()
          if marker not in text: raise SystemExit('forge test insertion marker missing')
          p.write_text(text.replace(marker, addition + marker, 1))

          p = Path('package.json')
          pkg = json.loads(p.read_text())
          pkg['version'] = '0.8.1'
          p.write_text(json.dumps(pkg, indent=2) + '\n')

          replace('CHANGELOG.md', '# Changelog\n\n', '''# Changelog\n\n## 0.8.1\n\n- fix intent-first Forge execution from automatically created temp directories: Docker runs forged code as a non-root UID, while `mkdtemp` creates 0700 roots; Forge now makes only the generated root traversable (0755) before first-run isolation\n- prefer npm-backed GitHub repositories when `cap solve` spends bounded Forge attempts, matching the current executable binder boundary instead of wasting attempts on repositories with no installable npm artifact\n- increase the default Forge attempt budget from 4 to 6 while preserving every failed attempt and reason in the result\n- update generated Capability/Forge projects to depend on the fixed 0.8.1 runtime\n\n''')

          # Make intent-first solving part of the permanent released-package smoke, using a capability absent from the seed registry.
          marker = '''      - name: Inspect an existing npm package without installing it\n'''
          addition = '''      - name: Solve an unseen outcome by acquiring software during the run\n        run: |\n          cap solve "convert separated text to camel case" --input '{"args":["hello capability world"]}' --approve > /tmp/solve.json\n          grep -q '"route": "forged"' /tmp/solve.json\n          grep -q 'helloCapabilityWorld' /tmp/solve.json\n          grep -q '"status": "succeeded"' /tmp/solve.json\n'''
          p = Path('.github/workflows/ecosystem-smoke.yml')
          text = p.read_text()
          if marker not in text: raise SystemExit('smoke insertion marker missing')
          p.write_text(text.replace(marker, addition + marker, 1))
          PY
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run registry
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run registry:validate
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/solve-v081-prepare.yml'
          git commit -m "Fix intent-first Capability Solve execution"
          git push origin HEAD:solve-v0.8.1
