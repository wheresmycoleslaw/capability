name: Prepare Capability 1.1.1

on:
  push:
    branches:
      - release/1.1.1-resolution-fix
    paths:
      - .github/workflows/agent-prep-1.1.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.1-resolution-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bump package and release marker
        run: |
          npm version 1.1.1 --no-git-tag-version
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.description="An ability-resolution and governed execution layer for AI agents: use prepared providers first, then resolve abilities from the broader software world."; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          printf '1.1.1\n' > .release
          npm run registry
          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); t=p.read_text(); h="# Changelog\n\n"; e="## 1.1.1\n\n- fix `need()` so discovery-only requests resolve across prepared providers, the Capability index, npm, and GitHub without requiring Forge/materialization to succeed first\n- turn natural-language outcomes into bounded focused software searches and rank direct utilities ahead of framework/plugin near-misses\n- expose the runtime pure built-in abilities as a first-class prepared provider for cloud and serverless consumers\n- make execution continue past discovery-only providers rather than returning a misleading ready result\n- preserve external software as explicitly non-execution-ready and authority-incomplete until it is acquired/materialized in an appropriate execution environment\n- add deterministic and live-network regression coverage across unrelated software needs\n\n"; assert t.startswith(h); p.write_text(h+e+t[len(h):]) if "## 1.1.1\n" not in t else None'
      - name: Verify release candidate
        run: |
          npm install --ignore-scripts
          npm test
          npm run conformance
          npm run registry:validate
          npm pack --dry-run
      - name: Commit release metadata
        run: |
          rm -f .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- package.json package-lock.json registry/index.json .release CHANGELOG.md
          git add -u -- .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git commit -m 'Release Capability 1.1.1'
          git push origin HEAD:release/1.1.1-resolution-fix
