name: Prepare Capability 1.1.1

on:
  push:
    branches:
      - release/1.1.1-resolution-fix
    paths:
      - .github/workflows/agent-prep-1.1.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.1-resolution-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bump package and release marker
        run: |
          npm version 1.1.1 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.description = 'An ability-resolution and governed execution layer for AI agents: use prepared providers first, then resolve abilities from the broader software world.';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          printf '1.1.1\n' > .release
          npm run registry
          python3 <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          heading = '# Changelog\n\n'
          entry = '''## 1.1.1

- fix `need()` so discovery-only requests resolve across prepared providers, the Capability index, npm, and GitHub without requiring Forge/materialization to succeed first
- turn natural-language outcomes into bounded focused software searches and rank direct utilities ahead of framework/plugin near-misses
- expose the runtime's pure built-in abilities as a first-class prepared provider for cloud and serverless consumers
- make execution continue past discovery-only providers rather than returning a misleading ready result
- preserve external software as explicitly non-execution-ready and authority-incomplete until it is acquired/materialized in an appropriate execution environment
- add deterministic and live-network regression coverage across unrelated software needs

'''
          if '## 1.1.1\n' not in text:
              assert text.startswith(heading)
              path.write_text(heading + entry + text[len(heading):])
          PY
      - name: Verify release candidate
        run: |
          npm install --ignore-scripts
          npm test
          npm run conformance
          npm run registry:validate
          npm pack --dry-run
      - name: Commit release metadata
        run: |
          rm -f .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- package.json package-lock.json registry/index.json .release CHANGELOG.md
          git add -u -- .github/workflows/agent-prep-1.1.1.yml .github/workflows/agent-prep-1.1.1-pr.yml .release-prep-trigger .release-prep-trigger-2 .release-prep-trigger-3
          git commit -m 'Release Capability 1.1.1'
          git push origin HEAD:release/1.1.1-resolution-fix
