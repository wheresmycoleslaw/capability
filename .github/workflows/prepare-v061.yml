name: Prepare 0.6.1 Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-v061.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply hotfix and bump release candidate
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          pkg.version = '0.6.1';
          await writeFile('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let bridge = await readFile('src/bridge.ts', 'utf8');
          bridge = bridge.replace('  async execute(input) {\\n', '  async execute(input: Input) {\\n');
          bridge = bridge.replace('  verify(output) {\\n', '  verify(output: Output) {\\n');
          await writeFile('src/bridge.ts', bridge);

          let scaffold = await readFile('src/scaffold.ts', 'utf8');
          scaffold = scaffold.replace('const CAPABILITY_RUNTIME_VERSION = "^0.6.0";', 'const CAPABILITY_RUNTIME_VERSION = "^0.6.1";');
          await writeFile('src/scaffold.ts', scaffold);

          let adoption = await readFile('test/adoption.test.mjs', 'utf8');
          adoption = adoption.replace('"^0.6.0"', '"^0.6.1"');
          await writeFile('test/adoption.test.mjs', adoption);

          let changelog = await readFile('CHANGELOG.md', 'utf8');
          if (!changelog.includes('## 0.6.1')) {
            changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n## 0.6.1\n\n- fix generated npm CLI sidecars under strict TypeScript by explicitly typing bridge execute/verify hooks\n- add release-gate coverage that compiles and runs a sidecar around the unchanged TypeScript `tsc` package before publishing\n\n');
          }
          await writeFile('CHANGELOG.md', changelog);
          NODE
          node scripts/generate-registry.mjs --write
      - run: npm test
      - name: Compile and run a generated external sidecar before commit
        run: |
          node dist/cli.js bridge npm typescript /tmp/typescript-capability --id code/typescript-cli --bin tsc --effect filesystem.read --effect filesystem.write
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = '/tmp/typescript-capability/package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.dependencies['@wheresmycoleslaw/capability'] = `file:${process.cwd()}`;
          await writeFile(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --prefix /tmp/typescript-capability --ignore-scripts
          npm run build --prefix /tmp/typescript-capability
          node dist/cli.js run /tmp/typescript-capability/package.json code/typescript-cli '{"args":["--version"]}' --approve > /tmp/typescript-run.json
          grep -q 'succeeded' /tmp/typescript-run.json
      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/bridge.ts src/scaffold.ts test/adoption.test.mjs CHANGELOG.md registry/index.json
          git commit -m "Fix generated external sidecars for 0.6.1"
          git push origin HEAD:main
