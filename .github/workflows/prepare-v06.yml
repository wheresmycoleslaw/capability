name: Prepare 0.6 Release

on:
  push:
    branches: [universal-bridge-v0.6]
    paths:
      - .github/workflows/prepare-v06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-bridge-v0.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prepare-v06.mjs
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/scaffold.ts README.md registry/index.json
          git diff --cached --quiet && exit 0
          git commit -m "Prepare Capability 0.6.0 release"
          git push origin HEAD:universal-bridge-v0.6
